name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  checks: write
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        id: tests
        continue-on-error: true
        run: go test -json ./... > test-results.json

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Go Tests
          path: test-results.json
          reporter: golang-json

      - name: Fail if tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1

      - name: Build release binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/wiki-cli-darwin-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/wiki-cli-darwin-amd64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/wiki-cli-windows-amd64.exe .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
